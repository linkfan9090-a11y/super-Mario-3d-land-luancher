name: Build Nintendo 3DS Homebrew

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build 3DS app
        run: make

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: MarioLandLauncher-homebrew
          path: |
            MarioLandLauncher.3dsx
            MarioLandLauncher.smdh
            MarioLandLauncher.elf
          if-no-files-found: error